services:
  backend:
    # 本机 FastAPI + SQLite 是默认开发方式。仅在明确验证完整容器部署时，
    # 使用 `docker compose --profile container-backend up -d backend`。
    profiles: ["container-backend"]
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/sixiang
      - DATABASE_URL_SYNC=postgresql://postgres:postgres@db:5432/sixiang
      - VECTOR_DATABASE_URL=postgresql://postgres:postgres@db:5432/sixiang
      - REDIS_URL=redis://redis:6379/0
      - ENV=development
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-development-secret-before-deploying}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:5667}
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - S3_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin123}
      - S3_BUCKET=immersive-media
      - MEDIA_BASE_URL=${MEDIA_BASE_URL:-http://127.0.0.1:9000/immersive-media}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - ./backend:/app
    restart: always
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: sixiang
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sixiang"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
